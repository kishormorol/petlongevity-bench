[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "petlongevity-bench"
version = "0.2.0"
description = "Leakage-aware benchmark for evidence-grounded AI in dog/cat healthy-aging research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.18",
  "PyYAML>=6.0",
]

[project.scripts]
petbench = "petlongevity_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
